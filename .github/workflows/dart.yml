name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the .ipa to a release

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo only contains lib/, assets/ and pubspec.yaml. Generate the iOS runner project here.
      - name: Generate iOS project
        run: |
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          flutter create --platforms=ios --org com.rososja --project-name ros_osja .
          cp "$RUNNER_TEMP/main.dart" lib/main.dart
          rm -rf test

      - name: Set app name and lock to landscape
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ROS OSJA" "$PLIST"
          for KEY in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :$KEY array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          done

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 ROS_OSJA.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/ROS_OSJA.ipa
          tag: v1.0
          overwrite: true
          body: "Unsigned ROS OSJA build. Sign and install it with Sideloadly (or with ShenSign)."
